<!DOCTYPE html>
<html>
<head>
<title>Miserbot Early Access</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
background:black;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
width:90%;
max-width:400px;
text-align:center;
}

h1{
font-size:24px;
margin-bottom:30px;
}

input{
width:100%;
padding:15px;
margin-bottom:20px;
border-radius:12px;
border:none;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#d4af37;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>Enter your info to get early access</h1>

<input id="name" placeholder="Name">

<input id="email" placeholder="Email">

<button onclick="join()">Join</button>

</div>

<script>

async function join(){

const name = document.getElementById("name").value
const email = document.getElementById("email").value

try{

const res = await fetch("https://web-production-c03c9.up.railway.app/webhook",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:name,
email:email,
source:"website"
})
})

const data = await res.json()

alert("You're on the waitlist!")

}catch(e){

alert("Server error")

}

}

</script>

</body>
</html>
