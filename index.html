<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiserBot — AI Automation</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #C9A84C;
  --black: #080808;
  --card: #141414;
  --white: #F5F0E8;
  --dim: #aaa;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--black);
  color: var(--white);
  font-family: 'Montserrat', sans-serif;
}

/* HERO */
.hero {
  text-align:center;
  padding:120px 20px 40px;
  animation: fadeUp 1s ease;
}

.hero h1 {
  font-family:'Cormorant Garamond', serif;
  font-size:64px;
}

.hero em { color: var(--gold); }

.hero p { color: var(--dim); margin-top:15px; }

/* TRUST STRIP */
.trust {
  text-align:center;
  font-size:12px;
  letter-spacing:2px;
  color:#777;
  padding:10px;
}

/* CHAT */
.chat-box {
  max-width:420px;
  margin:30px auto;
  background:var(--card);
  border-radius:12px;
  border:1px solid #222;
  overflow:hidden;
}

.chat-header {
  padding:12px;
  font-size:12px;
  color:#aaa;
  border-bottom:1px solid #222;
}

.chat-messages {
  height:320px;
  overflow:auto;
  padding:20px;
}

.msg {
  margin:10px 0;
  padding:12px;
  border-radius:10px;
  max-width:80%;
  animation: fadeUp 0.3s ease;
}

.user {
  background: var(--gold);
  color:black;
  margin-left:auto;
}

.bot {
  background:#1a1a1a;
}

.typing {
  display:flex;
  gap:5px;
}

.typing span {
  width:6px; height:6px;
  background:#777;
  border-radius:50%;
  animation: bounce 1s infinite;
}

.typing span:nth-child(2){ animation-delay:.2s;}
.typing span:nth-child(3){ animation-delay:.4s;}

@keyframes bounce {
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-5px);}
}

/* INPUT */
.chat-input {
  display:flex;
  border-top:1px solid #222;
}

.chat-input input {
  flex:1;
  padding:14px;
  background:black;
  border:none;
  color:white;
}

.chat-input button {
  padding:14px;
  background:var(--gold);
  border:none;
}

/* FORM */
.form {
  max-width:420px;
  margin:30px auto;
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid #222;
}

.form input {
  width:100%;
  padding:12px;
  margin-top:10px;
  background:black;
  border:1px solid #222;
  color:white;
}

.form button {
  width:100%;
  padding:14px;
  margin-top:15px;
  background:var(--gold);
  border:none;
}

.status {
  text-align:center;
  margin-top:10px;
  color:var(--dim);
}

@keyframes fadeUp {
  from {opacity:0; transform:translateY(20px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="hero">
  <h1>AI That <em>Closes</em></h1>
  <p>Automate conversations. Capture leads. Scale instantly.</p>
</div>

<div class="trust">
  Trusted AI Automation • 24/7 Lead Capture • Instant Response
</div>

<div class="chat-box">
  <div class="chat-header">MiserBot • Online</div>
  <div class="chat-messages" id="chat"></div>

  <div class="chat-input">
    <input id="message" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<div class="form">
  <h3>Request Demo</h3>
  <input id="name" placeholder="Full Name">
  <input id="email" placeholder="Email">
  <input id="phone" placeholder="Phone">
  <button onclick="submitLead()">Submit</button>
  <p class="status" id="status"></p>
</div>

<script>
const API = "https://miserbot-v10-production.up.railway.app";
const chat = document.getElementById("chat");

function addMsg(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

// AUTO START
window.onload=()=>{
  setTimeout(()=>{
    addMsg("👋 Welcome to MiserBot. Type 'hi' to begin.","bot");
  },500);
};

function showTyping(){
  const div=document.createElement("div");
  div.className="msg bot typing";
  div.innerHTML="<span></span><span></span><span></span>";
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  return div;
}

function sendMessage(){
  const input=document.getElementById("message");
  const text=input.value.trim();
  if(!text)return;

  addMsg(text,"user");
  input.value="";

  const typing=showTyping();

  fetch(API+"/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text})
  })
  .then(res=>res.json())
  .then(data=>{
    typing.remove();
    addMsg(data.reply,"bot");
  })
  .catch(()=>{
    typing.remove();
    addMsg("Connection error","bot");
  });
}

function submitLead(){
  const status=document.getElementById("status");

  const name=document.getElementById("name");
  const email=document.getElementById("email");
  const phone=document.getElementById("phone");

  if(!name.value||!email.value||!phone.value){
    status.innerText="Fill all fields";
    return;
  }

  status.innerText="Sending...";

  fetch(API+"/lead",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      name:name.value,
      email:email.value,
      phone:phone.value
    })
  })
  .then(()=>{
    status.innerText="Submitted ✔";
    name.value=""; email.value=""; phone.value="";
  })
  .catch(()=>status.innerText="Error");
}
</script>

</body>
</html>
