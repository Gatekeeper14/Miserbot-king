<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MiserBot 👑</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      font-size: 2.5rem;
    }

    input {
      padding: 12px;
      margin: 10px;
      width: 250px;
      border: none;
      border-radius: 5px;
    }

    button {
      padding: 12px 20px;
      background: gold;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: orange;
    }
  </style>
</head>
<body>

  <h1>MiserBot 👑</h1>
  <p>Enter your info to get early access</p>

  <input type="text" id="name" placeholder="Your Name"><br>
  <input type="email" id="email" placeholder="Your Email"><br>
  <button onclick="submitForm()">Join Now</button>

  <script>
    async function submitForm() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;

      if (!name || !email) {
        alert("Please fill out all fields");
        return;
      }

      try {
        const res = await fetch("https://web-production-c03c9.up.railway.app/webhook", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name: name,
            email: email,
            source: "website"
          })
        });

        const data = await res.json();
        console.log(data);

        if (data.status === "success") {
          alert("You're in! MiserBot will contact you 👑");
        } else {
          alert("Something went wrong.");
        }

      } catch (err) {
        alert("Connection failed.");
      }
    }
  </script>

</body>
</html>
