<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiserBot — AI Automation</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --gold-dim: #8B6914;
  --black: #080808;
  --black-soft: #111;
  --card: #141414;
  --white: #F5F0E8;
  --white-dim: #aaa;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--black);
  color: var(--white);
  font-family: 'Montserrat', sans-serif;
}

/* HERO */
.hero {
  text-align: center;
  padding: 120px 20px 60px;
}

.hero h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 60px;
  font-weight: 300;
}

.hero em { color: var(--gold); }

.hero p {
  color: var(--white-dim);
  margin-top: 20px;
}

/* CHAT */
.chat-box {
  max-width: 420px;
  margin: 40px auto;
  background: var(--card);
  border: 1px solid #222;
  border-radius: 12px;
  overflow: hidden;
}

.chat-messages {
  height: 300px;
  overflow-y: auto;
  padding: 20px;
}

.msg {
  margin: 10px 0;
  padding: 10px 14px;
  border-radius: 10px;
  max-width: 80%;
}

.user {
  background: var(--gold);
  color: black;
  margin-left: auto;
}

.bot {
  background: #1a1a1a;
}

.chat-input {
  display: flex;
  border-top: 1px solid #222;
}

.chat-input input {
  flex: 1;
  padding: 14px;
  background: black;
  border: none;
  color: white;
}

.chat-input button {
  padding: 14px;
  background: var(--gold);
  border: none;
  cursor: pointer;
}

/* FORM */
.form {
  max-width: 420px;
  margin: 40px auto;
  background: var(--card);
  padding: 20px;
  border: 1px solid #222;
  border-radius: 12px;
}

.form input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: black;
  border: 1px solid #222;
  color: white;
}

.form button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  background: var(--gold);
  border: none;
}

.status {
  text-align: center;
  margin-top: 10px;
  color: var(--white-dim);
}
</style>
</head>

<body>

<div class="hero">
  <h1>The Future of <em>Business</em></h1>
  <p>AI automation that captures every opportunity</p>
</div>

<div class="chat-box">
  <div class="chat-messages" id="chat"></div>

  <div class="chat-input">
    <input id="message" placeholder="Type here...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<div class="form">
  <h3>Request Demo</h3>
  <input id="name" placeholder="Full Name">
  <input id="email" placeholder="Email">
  <input id="phone" placeholder="Phone">
  <button onclick="submitLead()">Submit</button>
  <p class="status" id="status"></p>
</div>

<script>
const API = "https://miserbot-v10-production.up.railway.app";

const chat = document.getElementById("chat");

function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// AUTO START BOT
window.onload = () => {
  setTimeout(() => {
    addMsg("👋 Welcome to GetMiserBot. Type 'hi' to begin.", "bot");
  }, 500);
};

function sendMessage() {
  const input = document.getElementById("message");
  const text = input.value.trim();
  if (!text) return;

  addMsg(text, "user");
  input.value = "";

  fetch(API + "/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ message: text })
  })
  .then(res => res.json())
  .then(data => addMsg(data.reply, "bot"))
  .catch(() => addMsg("Connection error", "bot"));
}

function submitLead() {
  const status = document.getElementById("status");

  const name = document.getElementById("name");
  const email = document.getElementById("email");
  const phone = document.getElementById("phone");

  if (!name.value || !email.value || !phone.value) {
    status.innerText = "Fill all fields";
    return;
  }

  status.innerText = "Sending...";

  fetch(API + "/lead", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      name: name.value,
      email: email.value,
      phone: phone.value
    })
  })
  .then(() => {
    status.innerText = "Submitted ✔";
    name.value = "";
    email.value = "";
    phone.value = "";
  })
  .catch(() => status.innerText = "Error");
}
</script>

</body>
</html>
