<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiserBot 👑</title>

<style>

body{
font-family: Arial, sans-serif;
background: linear-gradient(135deg,#111,#1c1c1c);
color:white;
text-align:center;
padding-top:120px;
}

h1{
font-size:48px;
margin-bottom:10px;
}

p{
color:#ccc;
margin-bottom:40px;
}

form{
display:flex;
flex-direction:column;
align-items:center;
gap:15px;
}

input{
width:280px;
padding:14px;
border:none;
border-radius:8px;
font-size:16px;
}

button{
background:#FFD700;
color:black;
border:none;
padding:14px 30px;
font-size:16px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

button:hover{
opacity:0.9;
}

</style>

</head>

<body>

<h1>MiserBot 👑</h1>

<p>Enter your info to get early access</p>

<form id="joinForm">

<input
id="name"
type="text"
placeholder="Your name"
required
>

<input
id="email"
type="email"
placeholder="Your email"
required
>

<button type="submit">Join 👑</button>

</form>

<script>

document.getElementById("joinForm").addEventListener("submit", async function(e){

e.preventDefault()

const name=document.getElementById("name").value
const email=document.getElementById("email").value

try{

const response=await fetch("https://miserbot-v10-production.up.railway.app/webhook",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name:name,
email:email
})

})

if(response.ok){

alert("You're in! MiserBot will contact you 👑")

}else{

alert("Something went wrong")

}

}catch(err){

alert("Server error")

}

})

</script>

</body>
</html>
